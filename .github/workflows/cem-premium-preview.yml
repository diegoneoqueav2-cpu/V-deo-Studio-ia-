name: CEM Premium Preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cem-premium-preview.yml'
      - 'cem-premium/preview.py'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - run: blender -b -t 4 -P cem-premium/preview.py
      - run: ffmpeg -y -framerate 30 -i frames/%04d.png -c:v libx264 -pix_fmt yuv420p cem-preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: CEM-3D-preview
          path: |
            cem-preview.mp4
            cem-preview.blend
