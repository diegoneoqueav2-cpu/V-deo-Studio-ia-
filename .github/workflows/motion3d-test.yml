name: Motion 3D test
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - run: blender -b -t 4 --python motion3d/test_phone.py
      - run: ffmpeg -framerate 24 -i frames/%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart phone.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion3d-phone
          path: phone.mp4
