name: Motion Pro Hybrid
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - run: blender -b -t 4 --python-exit-code 1 --python motion3d/pro/preview.py
      - run: mkdir -p motion3d/hybrid/public && cp studio-preview.png motion3d/hybrid/public/
      - working-directory: motion3d/hybrid
        run: npm install && npm run render
      - run: ffmpeg -y -i motion3d/hybrid/out.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart motion-pro.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: motion-pro-hybrid
          path: motion-pro.mp4
