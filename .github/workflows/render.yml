name: Render VIDEO-DIRECTOR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Remotion browser
        run: npx remotion browser ensure
      - name: Render MP4
        run: npm run render
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-director-mp4
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
