name: Mixphone 3D
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg fonts-dejavu-core
      - run: mkdir -p frames && blender -b -t 4 --python-exit-code 1 --python motion3d/mixphone.py
      - run: ffmpeg -framerate 24 -i frames/%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart mixphone.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: mixphone-3d
          path: mixphone.mp4
